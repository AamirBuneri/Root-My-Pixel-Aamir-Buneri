name: Build Pixel Payloads

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-payloads.yml'
      - 'app/src/main/assets/exploits/wallpaper.png'
      - 'app/src/main/assets/exploits/wallpaper.webp'
      - 'scripts/build_payloads.py'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26c
          add-to-path: true

      - name: Clone pixel-ksu-root
        run: git clone --depth=1 https://github.com/JingMatrix/pixel-ksu-root.git ksu_root

      - name: Install dependencies
        run: pip install Pillow -q

      - name: Run build script
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: python3 scripts/build_payloads.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pixel-payloads
          path: ksu_root/build/payloads/*.so
          retention-days: 30

      - name: Commit to repo
        run: |
          SO_COUNT=$(ls ksu_root/build/payloads/*.so 2>/dev/null | wc -l)
          echo "Built $SO_COUNT .so files:"
          ls -lh ksu_root/build/payloads/*.so 2>/dev/null
          if [ "$SO_COUNT" -gt 0 ]; then
            mkdir -p app/src/main/assets/exploits
            cp ksu_root/build/payloads/pixel6-8-series.so app/src/main/assets/exploits/
            cp ksu_root/build/payloads/pixel9-series.so   app/src/main/assets/exploits/
            cp ksu_root/build/payloads/pixel8a.so         app/src/main/assets/exploits/
            cp ksu_root/build/payloads/pixel6a-cp1a.so    app/src/main/assets/exploits/
            cp ksu_root/build/payloads/pixel10-series.so  app/src/main/assets/exploits/
            echo "Copied .so files to exploits folder"
            ls -lh app/src/main/assets/exploits/*.so
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/src/main/assets/exploits/pixel6-8-series.so
            git add app/src/main/assets/exploits/pixel9-series.so
            git add app/src/main/assets/exploits/pixel8a.so
            git add app/src/main/assets/exploits/pixel6a-cp1a.so
            git add app/src/main/assets/exploits/pixel10-series.so
            git status
            git diff --staged --quiet && echo "Nothing changed" || git commit -m "Auto-build: Update payload .so files"
            git push origin main
          else
            echo "No .so files built - check Build step"
            exit 1
          fi
